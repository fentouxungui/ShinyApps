# ShinyApps shell installers (Windows + macOS).
# Place at ShinyApps/.github/workflows/build-desktop.yml
#
# The shell version is derived from the release tag (APP_VERSION) inside
# build-suite.R, so you never edit app.version in _shinyelectron.yml by hand.
#
# Attach to a release either by pushing a v* tag, or by running this workflow
# manually and supplying the target `tag`.

name: Build ShinyApps desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach installers to"
        required: false
        type: string
        default: "v0.1.1"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: win }
          - { os: macos-latest,   platform: mac }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install shinyelectron (fork) and its runtime deps
        shell: Rscript {0}
        run: |
          install.packages("pak")
          pak::pak(c("fentouxungui/shinyelectron@multi-app-store", "rlang", "withr", "renv"))

      - name: Provide HDF5 for scConvert (macOS)
        if: matrix.platform == 'mac'
        run: |
          brew install hdf5 pkg-config
          H5="$(brew --prefix hdf5)"
          echo "PKG_CONFIG_PATH=$H5/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "HDF5_CFLAGS=-I$H5/include" >> "$GITHUB_ENV"
          echo "HDF5_LIBS=-L$H5/lib -lhdf5" >> "$GITHUB_ENV"

      - name: Build the suite
        shell: Rscript {0}
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          APP_VERSION: ${{ inputs.tag || github.ref_name }}
        run: source("build-suite.R")

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            build/electron-app/dist/*.exe
            build/electron-app/dist/*.exe.blockmap
            build/electron-app/dist/*.dmg
            build/electron-app/dist/*.dmg.blockmap
            build/electron-app/dist/latest*.yml

  release:
    name: Release
    needs: build
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: artifacts/**/*
          generate_release_notes: true
