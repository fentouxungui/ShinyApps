# ShinyApps desktop installers (Windows + macOS).
# Place at ShinyApps/.github/workflows/build-desktop.yml
#
# Option 1: the app source tarballs are committed under dependency/, so there is
# no `prepare` job -- `build` checks out the repo (bringing dependency/) and runs
# build-suite.R directly.
#
# Linux excluded: the `bundled` strategy ships portable R (macOS/Windows only).

name: Build ShinyApps desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: win }
          - { os: macos-latest,   platform: mac }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5      # brings the committed dependency/*.tar.gz

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install shinyelectron (fork) and its runtime deps
        shell: Rscript {0}
        run: |
          install.packages("pak")
          pak::pak(c("fentouxungui/shinyelectron@multi-app-store", "rlang", "withr", "renv"))

      # scConvert compiles from source inside the bundled R runtime; its configure
      # needs HDF5. On macOS provide a system HDF5 (Windows relies on hdf5r).
      - name: Provide HDF5 for scConvert (macOS)
        if: matrix.platform == 'mac'
        run: |
          brew install hdf5 pkg-config
          H5="$(brew --prefix hdf5)"
          echo "PKG_CONFIG_PATH=$H5/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "HDF5_CFLAGS=-I$H5/include" >> "$GITHUB_ENV"
          echo "HDF5_LIBS=-L$H5/lib -lhdf5" >> "$GITHUB_ENV"

      - name: Build the suite
        shell: Rscript {0}
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: source("build-suite.R")

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          if-no-files-found: error
          # Top level of electron-builder's output only (* not **).
          path: |
            build/electron-app/dist/*.exe
            build/electron-app/dist/*.exe.blockmap
            build/electron-app/dist/*.dmg
            build/electron-app/dist/*.dmg.blockmap
            build/electron-app/dist/latest*.yml

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
