# Regenerate catalog.json from each app repo's latest release AND publish the
# README + icons/ folder, all to gh-pages.
#
# Place at ShinyApps/.github/workflows/publish-catalog.yml
#
# The launcher (store mode) reads icon URLs from catalog.json, so the PNGs must
# be reachable at https://fentouxungui.github.io/ShinyApps/icons/<id>.png.
#
# catalog/README.md is rendered from catalog/catalog.json by
# catalog/render_readme.py and published to gh-pages as README.md.
#
# An app whose repo has no published release is kept in the catalog with an
# empty version and no artifacts (rendered as "unavailable"), instead of
# failing the whole job.

name: Publish catalog

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [bundle-updated]
  push:
    branches: [main]
    paths: ["catalog/apps.yml", "catalog/render_readme.py", "icons/**"]

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build catalog.json from releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          python3 - <<'PY'
          import json, os, re, subprocess, sys, datetime, hashlib
          import yaml

          reg = yaml.safe_load(open("catalog/apps.yml"))
          apps = []
          for a in reg["apps"]:
              repo = a["repo"]
              app = {k: a[k] for k in a if k != "repo"}

              # The launcher caches catalog icons by URL and never re-fetches a
              # URL it already has, so replacing a PNG in place leaves existing
              # clients on the stale image. Append a short content hash to local
              # icon URLs: the URL changes if and only if the bytes change, and
              # every client re-downloads on the next catalog refresh.
              icon = app.get("icon")
              prefix = "https://fentouxungui.github.io/ShinyApps/icons/"
              if icon and icon.startswith(prefix):
                  fname = icon.split("?", 1)[0].rsplit("/", 1)[-1]
                  icon_path = os.path.join("icons", fname)
                  if os.path.isfile(icon_path):
                      with open(icon_path, "rb") as fh:
                          digest = hashlib.sha256(fh.read()).hexdigest()[:12]
                      app["icon"] = icon.split("?", 1)[0] + "?v=" + digest

              # No published release -> keep the entry but mark it unavailable
              # instead of aborting the whole catalog build.
              try:
                  rel = json.loads(subprocess.check_output(
                      ["gh", "api", f"repos/{repo}/releases/latest"],
                      text=True, stderr=subprocess.DEVNULL))
              except subprocess.CalledProcessError as e:
                  print(f"WARN: {a['id']} ({repo}): no published release "
                        f"(gh exit {e.returncode}); marking unavailable",
                        file=sys.stderr)
                  rel = None

              ver = ""
              arts = {}
              arts_by_runtime = {}
              app_abi = str(a.get("r_abi") or "")
              if not app_abi and a.get("r_version"):
                  app_abi = ".".join(str(a["r_version"]).split(".")[:2])
              asset_re = re.compile(
                  r"^" + re.escape(a["id"]) +
                  r"-(.+)-(win-x64|win-arm64|mac-x64|mac-arm64|linux-x64)"
                  r"(?:-r([0-9]+\.[0-9]+))?\.zip$"
              )
              if rel is not None:
                  ver = (rel.get("tag_name") or "").lstrip("v")
                  parsed = []
                  for asset in rel.get("assets", []):
                      n = asset["name"]
                      m = asset_re.match(n)
                      if not m:
                          continue
                      v, plat, abi = m.group(1), m.group(2), (m.group(3) or "")
                      if v != ver:
                          continue
                      parsed.append((abi, plat, asset))
                  available_abis = sorted(
                      {p[0] for p in parsed if p[0]},
                      key=lambda x: tuple(int(part) for part in x.split(".")),
                  )
                  if not app_abi and available_abis:
                      app_abi = available_abis[0]
                  if app_abi:
                      app["r_abi"] = app_abi
                  for abi, plat, asset in parsed:
                      art = {
                          "url": asset["browser_download_url"],
                          "size": asset["size"],
                          "sha256": (asset.get("digest") or "").replace("sha256:", ""),
                      }
                      effective_abi = abi or app_abi
                      if effective_abi:
                          art["r_abi"] = effective_abi
                          arts_by_runtime.setdefault(plat, {})["r-" + effective_abi] = art
                      # Older shells only read the flat artifacts map. Keep it
                      # pointed at the app's declared/default ABI; do not offer a
                      # 4.7 bundle to a 4.6 shell merely because it is the only one.
                      if effective_abi == app_abi:
                          arts[plat] = art
                  # If the default ABI came from the artifacts (no explicit
                  # app-level r_abi), fill the legacy map from that runtime.
                  if app_abi:
                      app["r_abi"] = app_abi
                      for plat, by_runtime in arts_by_runtime.items():
                          preferred = by_runtime.get("r-" + app_abi)
                          if preferred:
                              arts[plat] = preferred

              app["version"] = ver
              app["artifacts"] = arts
              app["artifacts_by_runtime"] = arts_by_runtime
              apps.append(app)

          cat = {
              "schema": 1,
              "updated_at": datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "shell_min_version": reg.get("shell_min_version", "0.1.0"),
              "runtimes": reg.get("runtimes", []),
              "apps": apps,
          }
          os.makedirs("catalog", exist_ok=True)
          json.dump(cat, open("catalog/catalog.json", "w"), indent=2)
          print("apps:", [(x["id"], x["version"] or "-", list(x["artifacts"])) for x in apps])
          PY

      - name: Render catalog/README.md
        run: python3 catalog/render_readme.py

      - name: Publish catalog.json + README.md + icons to gh-pages
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email actions@github.com
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add pages origin/gh-pages
          else
            git worktree add --orphan -b gh-pages pages
          fi

          # 1) catalog.json: overwrite only when it changed (ignore updated_at),
          #    so scheduled runs with no change create no new commit.
          if python3 - <<'PY'
          import json, sys
          new = json.load(open('catalog/catalog.json')); new.pop('updated_at', None)
          try:
              old = json.load(open('pages/catalog.json')); old.pop('updated_at', None)
          except Exception:
              old = None
          sys.exit(0 if old == new else 1)
          PY
          then
            echo "catalog unchanged"
          else
            cp catalog/catalog.json pages/catalog.json
          fi

          # 2) README.md: deterministic render of catalog.json, so it only changes
          #    when the app data changes (no volatile timestamp inside).
          cp catalog/README.md pages/README.md

          # The GitHub Pages theme puts its own title above the Markdown
          # content. Without _config.yml it falls back to the repository name
          # ("ShinyApps"), which now differs from the product name and appears
          # twice above the catalog. Pin the site header to the product name;
          # the page's own H1 is just "App Catalog".
          cat > pages/_config.yml <<'YAML'
          title: "ShinyApps Store"
          description: "Desktop app store for R/Shiny apps"
          YAML

          # 3) icons: always sync so catalog icon URLs resolve.
          if [ -d icons ]; then rm -rf pages/icons; cp -r icons pages/icons; fi

          cd pages
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to publish"
          else
            git commit -m "catalog/icons: update $(date -u +%FT%TZ)"
            git push origin HEAD:gh-pages
          fi
