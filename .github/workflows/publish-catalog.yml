# Regenerate catalog.json from each app repo's latest release AND publish the
# icons/ folder, both to gh-pages.
#
# Place at ShinyApps/.github/workflows/publish-catalog.yml
#
# The launcher (store mode) reads icon URLs from catalog.json, so the PNGs must
# be reachable at https://fentouxungui.github.io/ShinyApps/icons/<id>.png.

name: Publish catalog

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [bundle-updated]
  push:
    branches: [main]
    paths: ["catalog/apps.yml", "icons/**"]

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build catalog.json from releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -c "import yaml" 2>/dev/null || pip install --quiet pyyaml
          python3 - <<'PY'
          import json, os, subprocess, datetime
          import yaml

          reg = yaml.safe_load(open("catalog/apps.yml"))
          apps = []
          for a in reg["apps"]:
              repo = a["repo"]
              rel = json.loads(subprocess.check_output(
                  ["gh", "api", f"repos/{repo}/releases/latest"], text=True))
              ver = rel["tag_name"].lstrip("v")
              arts = {}
              for asset in rel.get("assets", []):
                  n = asset["name"]
                  if not n.endswith(".zip") or not n.startswith(a["id"] + "-"):
                      continue
                  toks = n[:-4][len(a["id"]) + 1:].split("-")
                  if len(toks) < 3:
                      continue
                  plat = "-".join(toks[-2:])
                  v = "-".join(toks[:-2])
                  if v != ver:
                      continue
                  arts[plat] = {
                      "url": asset["browser_download_url"],
                      "size": asset["size"],
                      "sha256": (asset.get("digest") or "").replace("sha256:", ""),
                  }
              app = {k: a[k] for k in a if k != "repo"}
              app["version"] = ver
              app["artifacts"] = arts
              apps.append(app)

          cat = {
              "schema": 1,
              "updated_at": datetime.datetime.utcnow().replace(microsecond=0).isoformat() + "Z",
              "shell_min_version": reg.get("shell_min_version", "0.1.0"),
              "apps": apps,
          }
          os.makedirs("catalog", exist_ok=True)
          json.dump(cat, open("catalog/catalog.json", "w"), indent=2)
          print("apps:", [(x["id"], x["version"], list(x["artifacts"])) for x in apps])
          PY

      - name: Publish catalog.json + icons to gh-pages
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email actions@github.com
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add pages origin/gh-pages
          else
            git worktree add --orphan -b gh-pages pages
          fi

          # 1) catalog.json: overwrite only when it changed (ignore updated_at),
          #    so scheduled runs with no change create no new commit.
          if python3 - <<'PY'
          import json, sys
          new = json.load(open('catalog/catalog.json')); new.pop('updated_at', None)
          try:
              old = json.load(open('pages/catalog.json')); old.pop('updated_at', None)
          except Exception:
              old = None
          sys.exit(0 if old == new else 1)
          PY
          then
            echo "catalog unchanged"
          else
            cp catalog/catalog.json pages/catalog.json
          fi

          # 2) icons: always sync so catalog icon URLs resolve.
          if [ -d icons ]; then rm -rf pages/icons; cp -r icons pages/icons; fi

          cd pages
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to publish"
          else
            git commit -m "catalog/icons: update $(date -u +%FT%TZ)"
            git push origin HEAD:gh-pages
          fi
