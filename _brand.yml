# ShinyApps Store visual identity.
# The shell reads these roles through shinyelectron's brand.yml support.
# Palette: ink base, R blue signal, shiny cyan gradient, paper surface; the
# gold spark is reserved for "featured / just published" and never used as a
# general UI accent.
meta:
  name: "ShinyApps Store"

color:
  palette:
    ink: "#0B1626"
    r-blue: "#2F6BFF"
    shiny-cyan: "#4FD1FF"
    spark-gold: "#FFC85C"
    paper: "#F4F8FF"
  primary: r-blue
  background: paper
