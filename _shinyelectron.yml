# ShinyApps suite -- root of the ShinyApps repo.
# Option 1: the app tarballs are COMMITTED under dependency/ (no CI `prepare` job).
# Build via build-suite.R, which the CI's `build` job runs.
#
# install_local_packages() identifies packages from the DESCRIPTION inside each
# tarball (not from the filename), and export() does not change the R process
# working directory, so these repo-relative paths resolve correctly.

app:
  name: "ShinyApps"
  version: "0.1.0"                 # shell version
  slug: "shinyapps"
  log_level: "info"
  description: "Desktop launcher for single-cell Shiny apps"
  author: "Zhang Yongchao"
  email: "zhangyongchao@nibs.ac.cn"
  homepage: "https://github.com/fentouxungui/ShinyApps"
  copyright: "Copyright (c) 2026 Zhang Yongchao."

build:
  type: "r-shiny"
  runtime_strategy: "bundled"

window:
  width: 1200
  height: 800

installer:
  app_id: "com.shinyapps.desktop"
  one_click: false
  allow_to_change_installation_directory: true

signing:
  sign: false                      # enable later with CSC_LINK / CSC_KEY_PASSWORD

dependencies:
  # Full CRAN/Bioconductor closure + the two app package names.
  # (renv auto-detect only sees `library(SeuratExplorer)` in app.R, not the
  #  package's own Imports, so the closure must be listed explicitly.)
  extra_packages:
    - SeuratExplorer
    - presto
    - Seurat
    - SeuratObject
    - ggplot2
    - DT
    - scConvertShiny
    - scConvert
    - hdf5r
    - crayon
    - shiny
    - shinydashboard
    - callr
    - zip
  r:
    # Lock the runtime R so the shell stays ABI-compatible with the app-layer
    # bundles published by build-app-bundle.yml (which uses the same 4.6.1).
    version: "4.6.1"
    local_packages:
      # Exactly the files committed under dependency/ (Option 1).
      - "dependency/SeuratExplorer_0.1.9.tar.gz"
      - "dependency/presto-1.1.0.tar.gz"
      - "dependency/scConvertShiny_0.1.1.tar.gz"
      - "dependency/scConvert-0.2.1.tar.gz"

updates:
  enabled: true
  provider: "github"
  check_on_startup: true
  auto_download: true
  auto_install: true
  github:
    owner: "fentouxungui"
    repo: "ShinyApps"

optimize:
  r_library: true
  r_runtime: true

apps:
  - id: seurat-explorer
    name: "SeuratExplorer"
    description: "Explore scRNA-seq data processed in Seurat"
    path: "./apps/seurat-explorer"
    # icon: "./icons/seurat-explorer.png"   # re-enable once icons are shipped

  - id: scconvert
    name: "scConvertShiny"
    description: "Convert single-cell formats (h5ad / h5Seurat / loom / MuData)"
    path: "./apps/scconvert"
    # icon: "./icons/scconvert.png"         # re-enable once icons are shipped
