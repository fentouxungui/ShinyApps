# ShinyApps suite -- root of the ShinyApps repo.
# Option 1: the app tarballs are COMMITTED under dependency/ (no CI `prepare` job).
# Build via build-suite.R, which the CI's `build` job runs.
#
# install_local_packages() identifies packages from the DESCRIPTION inside each
# tarball (not from the filename), and export() does not change the R process
# working directory, so these repo-relative paths resolve correctly.

app:
  name: "ShinyApps"
  version: "0.1.0"                 # shell version
  slug: "shinyapps"
  log_level: "info"
  description: "Desktop launcher for Shiny apps"
  author: "Zhang Yongchao"
  email: "zhangyongchao@nibs.ac.cn"
  homepage: "https://github.com/fentouxungui/ShinyApps"
  copyright: "Copyright (c) 2026 Zhang Yongchao."

build:
  type: "r-shiny"
  runtime_strategy: "bundled"

window:
  width: 1200
  height: 800

menu:
  help_url: "https://github.com/fentouxungui/ShinyApps/wiki"
  
installer:
  app_id: "com.shinyapps.desktop"
  one_click: false
  allow_to_change_installation_directory: true

signing:
  sign: false                      # enable later with CSC_LINK / CSC_KEY_PASSWORD

dependencies:
  # The shell ships ONLY the R runtime plus the minimal packages the launcher and
  # backend need. Each store app's bundle carries its own resolved closure
  # (see shared-library-policy.md); the shell no longer bundles app packages.
  # `shiny` is required by the R backend (shiny::runApp). `zip` is kept because
  # the app-bundle CI excludes packages present in its own toolchain, so zip must
  # be provided here when an app needs it at runtime.
  extra_packages:
    - shiny
    - zip
  r:
    # Lock the runtime R so the shell stays ABI-compatible with the app-layer
    # bundles published by build-app-bundle.yml (which uses the same 4.6.1).
    version: "4.6.1"

updates:
  enabled: true
  provider: "github"
  check_on_startup: true
  auto_download: true
  auto_install: true
  github:
    owner: "fentouxungui"
    repo: "ShinyApps"

optimize:
  r_library: true
  r_runtime: true

apps:
  # Lightweight placeholder apps that keep the build a multi-app suite
  # (is_multi_app requires >= 2 entries). Real applications are delivered as
  # store bundles (catalog/apps.yml), not baked into the shell.
  - id: welcome
    name: "Welcome"
    description: "ShinyApps launcher welcome"
    path: "./apps/welcome"

  - id: about
    name: "About"
    description: "About ShinyApps"
    path: "./apps/about"
