# ShinyApps app registry -- the single source of app metadata for the catalog.
# Place at  ShinyApps/catalog/apps.yml
# The publish-catalog workflow expands each entry with the latest release's
# version + per-platform artifact url/size/sha256 and writes catalog.json.
# Every key here EXCEPT `repo` is copied verbatim into catalog.json, which the
# launcher reads for Help/About: `docs` -> Help > Documentation; `homepage`,
# `email`, `author`, `copyright` -> About dialog.

schema: 1
shell_min_version: "0.1.0"

apps:
  - id: seurat-explorer
    repo: fentouxungui/SeuratExplorer
    name: SeuratExplorer
    author: "Zhang Yongchao"
    description: "Explore scRNA-seq data processed in Seurat"
    homepage: "https://github.com/fentouxungui/SeuratExplorer"
    docs: "https://github.com/fentouxungui/SeuratExplorer/wiki"
    email: "zhangyongchao@nibs.ac.cn"
    copyright: "(c) 2026 Zhang Yongchao"
    license: "GPL-3.0-or-later"
    icon: "https://fentouxungui.github.io/ShinyApps/icons/seurat-explorer.png"
    r_version: "4.6.1"

  - id: scconvert
    repo: fentouxungui/scConvertShiny
    name: scConvertShiny
    author: "Zhang Yongchao"
    description: "Convert single-cell formats (h5ad / h5Seurat / Loom / MuData / Seurat / SingleCellExperiment / Zarr etc.)"
    homepage: "https://github.com/fentouxungui/scConvertShiny"
    docs: "https://github.com/fentouxungui/scConvertShiny#readme"
    email: "zhangyongchao@nibs.ac.cn"
    copyright: "(c) 2026 Zhang Yongchao"
    license: "MIT"
    icon: "https://fentouxungui.github.io/ShinyApps/icons/scconvert.png"
    r_version: "4.6.1"

  - id: isee
    repo: fentouxungui/iSEE
    name: iSEE
    author: "Kevin Rue-Albrecht, Federico Marini, Charlotte Soneson, Aaron Lun"
    description: "Interactive SummarizedExperiment Explorer"
    homepage: "https://github.com/fentouxungui/iSEE"
    docs: "https://isee.github.io/iSEE/"
    email: "kevinrue67@gmail.com"
    copyright: "(c) 2026 iSEE authors"
    license: "MIT"
    icon: "https://fentouxungui.github.io/ShinyApps/icons/isee.png"
    r_version: "4.6.1"

  - id: xenashiny
    repo: fentouxungui/UCSCXenaShiny
    name: UCSCXenaShiny
    author: "Shixiang Wang, Yi Xiong, Shensuo Li, Longfei Zhao, Kai Gu, Yuzhong Peng, Yin Li, Fei Zhao"
    description: "Interactive analysis and visualization of UCSC Xena cancer genomics data"
    homepage: "https://github.com/fentouxungui/UCSCXenaShiny"
    docs: "https://openbiox.github.io/UCSCXenaShiny/"
    email: "w_shixiang@163.com"
    copyright: "(c) 2026 openbiox authors"
    license: "GPL-3.0-or-later"
    icon: "https://fentouxungui.github.io/ShinyApps/icons/xenashiny.png"
    r_version: "4.6.1"

  - id: spatiallibd
    repo: fentouxungui/spatialLIBD
    name: spatialLIBD
    author: "Leonardo Collado-Torres, Brenda Pardo, Abby Spangler, Lukas M. Weber, Andrew E. Jaffe, Kristen R. Maynard, and the spatialLIBD contributors"
    description: "Interactive visualization of spatially-resolved transcriptomics data (10x Genomics Visium) from the LIBD human DLPFC project"
    homepage: "https://github.com/fentouxungui/spatialLIBD"
    docs: "http://research.libd.org/spatialLIBD/"
    email: "lcolladotor@gmail.com"
    copyright: "(c) 2026 spatialLIBD authors (Lieber Institute for Brain Development)"
    license: "Artistic-2.0"
    icon: "https://fentouxungui.github.io/ShinyApps/icons/spatiallibd.png"
    r_version: "4.6.1"

