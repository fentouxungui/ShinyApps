  - id: csbb-shiny
    repo: fentouxungui/CSBB-Shiny
    name: CSBB-Shiny
    author: "Praneet Chaturvedi"
    description: "Computational Suite for Bioinformaticians and Biologists (CSBB): 8 downstream NGS modules - normalization, basic stats, differential expression, correlation profiles, functional/pathway enrichment, ChIP-ATAC seq and single-cell RNA-seq"
